# ==================== 颐智康养前端 Nginx 配置 (生产级) ====================
#
# 功能：
#   1. HTTP → HTTPS 自动重定向
#   2. API 反向代理到后端 (负载均衡 / keep-alive)
#   3. 静态资源缓存 (hash 文件永久缓存 / HTML 不缓存)
#   4. Gzip / Brotli 压缩
#   5. 安全头 (HSTS / CSP / X-Frame / X-Content-Type)
#   6. 访问限流 (API 爆破保护)
#   7. SPA 路由回退
#
# 使用方式 — 放在 frontend-admin/nginx.conf，Docker 构建时自动加载
#
# SSL 证书准备：
#   certbot certonly --standalone -d yzkang.com -d www.yzkang.com
#   证书路径挂载到容器: /etc/letsencrypt → 容器内同路径

upstream backend_pool {
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ── HTTP → HTTPS 重定向 ─────────────────────────
server {
    listen 80;
    server_name localhost;

    # 健康检查 (Let's Encrypt / 负载均衡探测)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ACME 验证 (用于 certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 所有其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主站点 ────────────────────────────────
server {
    listen 443 ssl http2;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── SSL 配置 (证书路径，生产环境挂载证书文件) ──
    # 如果证书不存在，请注释掉 443 server block，仅保留 80 server block
    ssl_certificate     /etc/letsencrypt/live/yzkang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yzkang.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ── 安全头 ─────────────────────────────────
    # HSTS: 浏览器强制 HTTPS (max-age=1年)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;

    # MIME 嗅探保护
    add_header X-Content-Type-Options "nosniff" always;

    # 跨站脚本保护
    add_header X-XSS-Protection "1; mode=block" always;

    # 引用策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 权限策略 (禁用不需要的浏览器 API)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── Gzip 压缩 ───────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff2;

    # ── 日志格式 ────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── 上传大小限制 ────────────────────────────
    client_max_body_size 50M;
    client_body_timeout 60s;

    # ── API 限流 (爆破保护) ─────────────────────
    # 定义限流区域: 10MB 内存, 10r/s 每 IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ── 静态资源缓存 ────────────────────────────
    # Vite 构建产物带 hash，永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # Favicon / robots / sitemap
    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
    }

    # ── API 代理 ─────────────────────────────────
    location /api/ {
        # 爆破保护
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_pool;
        proxy_http_version 1.1;

        # 头部转发
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # 长连接
        proxy_set_header Connection "";

        # 超时设置
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;

        # 不缓存 API 响应
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── Prometheus 指标 (内部) ───────────────────
    location /metrics {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Grafana 子路径代理 ───────────────────────
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA 路由回退 ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── 隐藏 Nginx 版本 ─────────────────────────
    server_tokens off;
}
