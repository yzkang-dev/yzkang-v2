# 颐智康养 CI/CD 流水线
# 触发：push / PR 到 main 分支

name: 颐智康养 CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ==================== 后端：代码检查 + 测试 ====================
  backend:
    name: 后端 — 检查 & 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff 代码检查
        run: ruff check . --ignore=F401,E501,F841

      - name: Pytest 单元测试
        env:
          SECRET_KEY: ci-test-secret
        run: pytest tests/ -v --tb=short --timeout=30

  # ==================== 前端：代码检查 + 构建 ====================
  frontend:
    name: 前端 — 检查 & 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建生产版本
        run: npm run build

  # ==================== Docker 镜像构建（不推送） ====================
  docker:
    name: Docker — 构建验证
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: 构建后端镜像
        run: docker build -t yzkang-backend:ci -f backend/Dockerfile backend/

      - name: 构建前端镜像
        run: docker build -t yzkang-frontend:ci -f frontend-admin/Dockerfile frontend-admin/
