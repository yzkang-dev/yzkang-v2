# 颐智康养 CI/CD 流水线
# 触发：push / PR 到 main 分支 → 自动测试 + 构建镜像 + 推送到 GHCR
#
# 环境变量配置 (GitHub Secrets):
#   GHCR_USERNAME — GitHub 用户名
#   GHCR_TOKEN    — GitHub Personal Access Token (write:packages)
#   DEPLOY_HOST   — 生产服务器 IP (可选)
#   DEPLOY_USER   — SSH 用户名 (可选)
#   DEPLOY_KEY    — SSH 私钥 (可选)

name: 颐智康养 CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/yzkang-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/yzkang-frontend

jobs:
  # ==================== 后端：代码检查 + 测试 ====================
  backend:
    name: 后端 — 检查 & 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: Pytest 测试
        env:
          SECRET_KEY: ci-test-secret
        run: pytest tests/ -v --tb=short

      - name: 测试覆盖率报告
        run: pytest tests/ --cov=. --cov-report=xml --cov-report=term

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ==================== 前端：测试 + 构建 ====================
  frontend:
    name: 前端 — 测试 & 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Vitest 单元测试
        run: npm run test

      - name: 构建生产版本
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-admin/dist
          retention-days: 7

  # ==================== Docker 镜像构建 + 推送 (仅 push 时) ====================
  docker:
    name: Docker — 构建 & 推送
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 metadata (后端)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest

      - name: 提取 metadata (前端)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest

      - name: 构建 & 推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建 & 推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: frontend-admin
          file: frontend-admin/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 部署到生产环境 (需配置 Secrets) ====================
  deploy:
    name: 部署 — 生产环境
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://yzkang.example.com

    steps:
      - name: 部署到服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/yzkang
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
