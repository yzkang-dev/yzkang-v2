# ==================== 颐智康养 — 演示环境 (staging) ====================
#
# 使用方式：
#   docker compose -f docker-compose.staging.yml up -d
#
# 特点：
#   - 独立数据库（含演示数据），与生产隔离
#   - Demo 账号自动初始化
#   - 数据每日自动重置 (cron)
#   - 独立端口 (8080)

services:
  # ── PostgreSQL (演示) ──────────────────────────
  db-staging:
    image: postgres:16-alpine
    container_name: yzkang-db-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: yzkang_demo
      POSTGRES_PASSWORD: demo_yzkang_pwd
      POSTGRES_DB: yzkang_demo
    volumes:
      - yzkang_pgdata_staging:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yzkang_demo -d yzkang_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── 后端 (演示) ────────────────────────────────
  backend-staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yzkang-backend-staging
    restart: unless-stopped
    depends_on:
      db-staging:
        condition: service_healthy
    environment:
      DB_HOST: db-staging
      DB_PORT: 5432
      DB_USER: yzkang_demo
      DB_PASSWORD: demo_yzkang_pwd
      DB_NAME: yzkang_demo
      SECRET_KEY: yzkang-staging-demo-secret
      RATE_LIMIT_MAX_REQUESTS: 1000
      RATE_LIMIT_WINDOW_SECONDS: 60
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 前端 (演示) ────────────────────────────────
  frontend-staging:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: yzkang-frontend-staging
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend-staging:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yzkang_pgdata_staging:
    name: yzkang_pgdata_staging
